<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rytm</title>
<meta name="description" content="Rytm: cele, nawyki i postępy w jednym miejscu.">
<meta name="theme-color" content="#F4F6F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rytm">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html{-webkit-tap-highlight-color:transparent}
/* Layout: one column app (max 640px). Brand bar with settings on top, goals grouped by category, fixed 5-tab bar at the bottom. Charts are inline SVG drawn from the same tokens. */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --fg:#14201D; --muted:#5C6A66; --line:#E0E6E4;
  --accent:#0E7C66; --accent-fg:#FFFFFF; --accent-soft:#DDF0EB;
  --good:#1B7F45; --good-soft:#DFF2E6; --warn:#9A6200; --warn-soft:#FBEFD6; --bad:#B93832; --bad-soft:#FBE4E2;
  --font-display:'Bricolage Grotesque','Inter',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513; --surface:#172120; --fg:#E6EEEB; --muted:#93A39D; --line:#263430;
    --accent:#3CCBA9; --accent-fg:#06211B; --accent-soft:#16342E;
    --good:#4CC27F; --good-soft:#15301F; --warn:#E0A84A; --warn-soft:#352A12; --bad:#EF6F68; --bad-soft:#3A1B1A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#172120; --fg:#E6EEEB; --muted:#93A39D; --line:#263430;
  --accent:#3CCBA9; --accent-fg:#06211B; --accent-soft:#16342E;
  --good:#4CC27F; --good-soft:#15301F; --warn:#E0A84A; --warn-soft:#352A12; --bad:#EF6F68; --bad-soft:#3A1B1A;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 104px}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;flex:1}
.iconbtn{min-width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;font-size:13px;padding:0 10px;gap:6px}
.iconbtn.on{border-color:var(--accent);color:var(--accent)}
.iconbtn[disabled]{opacity:.35;cursor:default}
.datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.datebar .d{flex:1;min-width:0;font-family:var(--font-display);font-weight:600;font-size:19px}
.datebar .d::first-letter{text-transform:uppercase}
.datebar .d small{display:block;font:500 12px var(--font-body);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.cat{margin:18px 2px 8px;font:600 12px var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.tile b{display:block;font:700 24px var(--font-display);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note p{margin:0;flex:1;min-width:180px}
.link{color:var(--accent);font-weight:600;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.offbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;margin-bottom:12px;font-size:13px}
.offbar span{flex:1;min-width:0;color:var(--muted)}
.sw{width:42px;height:24px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
.sw.on{background:var(--accent)} .sw.on::after{transform:translateX(18px)}
.goal{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0;padding-top:2px}
.goal:last-child{padding-bottom:2px}
.goal .gm{flex:1;min-width:0}
.gn{font-weight:600}
.gs{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:99px;padding:2px 8px;margin-top:4px}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.var{background:var(--accent-soft);color:var(--fg);font-weight:500}
.chk{width:40px;height:40px;border-radius:12px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:transparent}
.chk.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chk.lim.on{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.numwrap{display:flex;align-items:center;gap:6px;flex:none}
.num{width:76px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);text-align:right;padding:0 10px;font-variant-numeric:tabular-nums}
.unit{font-size:12px;color:var(--muted);min-width:26px}
.addbtn{height:38px;padding:0 14px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-weight:600;flex:none}
.vars{margin-top:8px}
.vars .q{font-size:12px;color:var(--muted);margin-bottom:5px}
.evs{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ev{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 10px;display:inline-flex;gap:6px;align-items:center}
.ev button{width:20px;height:20px;border-radius:50%;color:var(--muted)}
.bar-o{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar-i{height:100%;border-radius:99px;background:var(--accent)}
/* siatka tygodnia */
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wh{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.2;padding-bottom:2px}
.wh b{display:block;color:var(--fg);font-size:12px;font-variant-numeric:tabular-nums}
.wh.today b{color:var(--accent)}
.wrow{padding:10px 0;border-top:1px solid var(--line)}
.wrow .wt{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:6px}
.wrow .wt .gs{text-align:right}
.wc{height:30px;border-radius:7px;background:var(--bg);border:1px solid var(--line);font:600 10.5px var(--font-body);color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;min-width:0}
.wc.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.wc.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.wc.warn,.wc.lim{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.wc.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.wc.miss{border-style:dashed}
.wc.fut{opacity:.3}
.st-ok{color:var(--good)} .st-warn{color:var(--warn)} .st-bad{color:var(--bad)}
/* kalendarz miesiąca */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mc{aspect-ratio:1;max-width:100%;border-radius:9px;font:600 12px var(--font-body);font-variant-numeric:tabular-nums;color:var(--fg);display:flex;align-items:center;justify-content:center}
.mc.blank{background:none}
.lv0{background:color-mix(in srgb,var(--line) 85%,var(--surface))}
.lv1{background:color-mix(in srgb,var(--accent) 25%,var(--surface))}
.lv2{background:color-mix(in srgb,var(--accent) 50%,var(--surface))}
.lv3{background:color-mix(in srgb,var(--accent) 75%,var(--surface));color:var(--accent-fg)}
.lv4{background:var(--accent);color:var(--accent-fg)}
.mc.off{background:none;border:1.5px dashed var(--muted)}
.mc.fut{background:none;color:var(--muted);opacity:.5}
.mc.tod{box-shadow:inset 0 0 0 2px var(--fg)}
.mline{font-size:13px;color:var(--muted);margin-top:3px}
.mline b{color:var(--fg);font-weight:600}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;height:34px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);min-width:0}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.card h3{font-size:16px;margin-bottom:2px}
.card .sub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:10px var(--font-body)}
.chart .val{fill:var(--fg);font:600 9.5px var(--font-body)}
.chart .bar{fill:var(--accent)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .tg{stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
.chart .bandr{fill:var(--accent-soft)}
.chart .d-hit{fill:var(--good)} .chart .d-near{fill:var(--warn)} .chart .d-over{fill:var(--bad)} .chart .d-none{fill:var(--accent)}
.chart .h0{fill:color-mix(in srgb,var(--line) 85%,var(--surface))}
.chart .h1{fill:color-mix(in srgb,var(--accent) 25%,var(--surface))}
.chart .h2{fill:color-mix(in srgb,var(--accent) 50%,var(--surface))}
.chart .h3{fill:color-mix(in srgb,var(--accent) 75%,var(--surface))}
.chart .h4{fill:var(--accent)}
.chart .hoff{fill:none;stroke:var(--muted);stroke-width:1;stroke-dasharray:2 2}
.chart .tod{stroke:var(--fg);stroke-width:1.5}
.legend{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px;justify-content:flex-end}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
select{height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 10px;width:100%;margin-bottom:10px}
.hb{margin:10px 0}
.hb .l{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:4px}
.hb .l b{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:600;color:var(--muted);text-align:left;font-size:11.5px;padding:4px 6px 6px 0}
td{padding:7px 6px 7px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th:not(:first-child),td:not(:first-child){text-align:right}
.tscroll{overflow-x:auto}
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.nav div{max-width:640px;margin:0 auto;display:flex;padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav button{flex:1;min-width:0;height:56px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.nav button.on{color:var(--accent)}
.nav button.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;max-height:90%;overflow:auto;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto}
.sheet h2{font-size:20px;margin-bottom:12px}
.fl{display:block;font-weight:600;font-size:13px;margin:14px 0 6px}
.fl small{font-weight:400;color:var(--muted)}
.inp{width:100%;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px}
textarea.inp{height:auto;min-height:96px;padding:10px 12px;resize:vertical}
.row2{display:flex;gap:8px;align-items:flex-end}
.row2>*{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pill{border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:13px;background:var(--bg)}
.pill.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg);font-weight:600}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;background:var(--bg)}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-size:14px} .opt span{font-size:12.5px;color:var(--muted)}
.summary{background:var(--accent-soft);border-radius:12px;padding:12px;margin-top:16px;font-size:13.5px}
.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{height:44px;border-radius:12px;font-weight:600;padding:0 16px;border:1px solid var(--line);background:var(--surface)}
.btn.main{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);flex:1}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.45}
.glist{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line)}
.glist:first-child{border-top:0}
.glist .gm{flex:1;min-width:0}
.glist small{display:block;color:var(--muted);font-size:12.5px}
.srow{display:flex;gap:8px;align-items:center;padding:6px 0}
.srow .inp{flex:1}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13px;z-index:30;max-width:calc(100% - 32px)}
.mc.off{border:1.5px dashed var(--muted)}
.mc.big{flex-direction:column;gap:3px}
.cdots{display:flex;gap:2px}
.cdots i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.22}
.cdots i.y{opacity:1}
.mc.sel{outline:2.5px solid var(--fg);outline-offset:1px}
.mgrid.sm{gap:3px}
.mgrid.sm .mc{font-size:10.5px;border-radius:6px}
.cath{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 2px 8px}
.cath .cat{margin:0}
.caltog{font-size:12.5px;font-weight:600;color:var(--accent);padding:4px 0}
.ddh{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin:16px 0 4px}
.ddh b::first-letter{text-transform:uppercase}
.ddc{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.ddk{color:var(--muted);font-size:12px;font-weight:600}
.ev .evt{width:auto;height:auto;border-radius:0;color:var(--fg);text-align:left}
.pplbtn{display:block;width:100%;text-align:left;padding:12px 0 2px;border-top:1px solid var(--line);font-size:13px;font-weight:600;color:var(--accent)}
.prow{padding:8px 0;border-top:1px solid var(--line);margin-top:8px}
.prow .srow{padding:0 0 4px}
.cdet{font-size:13px;display:grid;gap:3px}
#note{min-height:80px}
.todo{font-size:13px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);margin-bottom:12px;line-height:1.7}
.todo .link{font-size:13px}
textarea.rv{min-height:70px}
.mrow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:8px}
.mb{border:1px solid var(--line);border-radius:10px;padding:6px 2px;background:var(--bg);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.mb b{font-size:16px}
.mb small{font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.md1{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.md2{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.md3{background:color-mix(in srgb,var(--line) 70%,var(--surface));color:var(--fg);border-color:var(--muted)}
.md4{background:var(--good-soft);color:var(--good);border-color:var(--good)}
.md5{background:var(--good);color:var(--surface);border-color:var(--good)}
.wc.md1,.wc.md2,.wc.md3,.wc.md4,.wc.md5,.mc.md1,.mc.md2,.mc.md3,.mc.md4,.mc.md5{border-color:transparent}
.step{display:flex;gap:4px;flex:none}
.step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);font-size:20px;line-height:1;background:var(--bg)}
.lt{padding:12px 0;border-top:1px solid var(--line)}
.lt:first-child{border-top:0;padding-top:2px}
.ltt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ltn{text-align:left;min-width:0}
.ltbar{position:relative;overflow:visible;margin-bottom:6px}
.ltmark{position:absolute;top:-3px;width:2px;height:14px;background:var(--fg);border-radius:1px;transform:translateX(-1px)}
.glrow{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line)}
.glrow:first-child{border-top:0}
.glrow .glist{border-top:0;flex:1;min-width:0}
.mv{display:flex;gap:4px;flex:none}
.mv button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.ins{padding:9px 0;border-top:1px solid var(--line)}
.ins:first-of-type{border-top:0}
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70}
.k1,.sc1{--c:var(--s1)} .k2,.sc2{--c:var(--s2)} .k3,.sc3{--c:var(--s3)}
.sd{gap:3px}
.sd i{opacity:1;width:6px;height:6px;background:color-mix(in srgb,var(--muted) 22%,transparent)}
.sd i.y{background:var(--c)}
.sd i.r{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.mc.sf1{background:color-mix(in srgb,var(--s1) 70%,var(--surface))}
.mc.sf2{background:color-mix(in srgb,var(--s2) 70%,var(--surface))}
.mc.sf3{background:color-mix(in srgb,var(--s3) 70%,var(--surface))}
.mc.sl1{background:color-mix(in srgb,var(--s1) 25%,var(--surface))}
.mc.sl2{background:color-mix(in srgb,var(--s2) 25%,var(--surface))}
.mc.sl3{background:color-mix(in srgb,var(--s3) 25%,var(--surface))}
.pill.sp.on{background:var(--bg);color:var(--fg);border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c)}

const nz=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l');
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;let p=Array.from({length:b.length+1},(_,j)=>j);for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
function matchAct(name){
  const n=nz(name||'').replace(/[^a-z ]/g,' ').replace(/\b(x|razy|raz|min|minut|dziennie|tygodniowo|w tygodniu)\b/g,' ').replace(/\s+/g,' ').trim();
  if(n.length<2)return[];
  const AMB={trening:['any','gym','run','home'],cwiczenia:['any','home','gym'],sport:['any','team']};
  if(AMB[n])return AMB[n].map(k=>({c:CAT_BY[k],s:70}));
  const words=n.split(' ').filter(w=>w.length>=4),out=[];
  CAT.forEach(c=>{
    let best=0;
    [c.n].concat(c.syn).forEach(sy=>{
      const s=nz(sy);
      if(n===s){best=100;return}
      if((' '+n+' ').includes(' '+s+' '))best=Math.max(best,s.length>=5?90:80);
      s.split(' ').forEach(v=>{if(v.length<4)return;words.forEach(w=>{if(w===v)best=Math.max(best,70);else{const d=lev(w,v);if(d<=(v.length>=8?2:1))best=Math.max(best,60-d*5)}})});
    });
    if(best)out.push({c,s:best});
  });
  out.sort((a,b)=>b.s-a.s);
  return(out.length&&out[0].s>=90?out.filter(x=>x.s>=out[0].s-20):out).slice(0,3);
}

function habitStrength(g){
  if(!(hasTarget(g)||isMeasure(g)))return null;
  const t=todayS(),first=Object.keys(S.log).sort()[0];if(!first)return null;
  let s=0,any=false;
  if(g.period==='day'){
    const a=1-Math.pow(.5,1/14);
    for(const d of range(first,t)){
      if(S.off[d]||pausedAt(g,d))continue;
      const v=isMeasure(g)?(val(g.id,d)!=null?1:0):goalDayScore(g,d);
      if(v==null||(d===t&&v<1))continue;
      s=s*(1-a)+a*v;any=true;
    }
  }else{
    const a=g.period==='week'?1-Math.pow(.5,1/3):1-Math.pow(.5,1/2);
    let p=g.period==='week'?wstart(first):mstart(first);
    while(p<=t){
      const pb=periodBounds(g,p),cur=pb[1]>=t,e=cur?t:pb[1];
      if(!pausedAt(g,pb[0])){
        let v;
        if(isMeasure(g))v=range(pb[0],e).some(d=>val(g.id,d)!=null)?1:0;
        else{const tot=sumRange(g.id,pb[0],e);v=g.type==='limit'?(tot<=g.target?1:0):Math.min(1,tot/g.target)}
        const skip=cur&&(g.type==='limit'?v===1:v<1);
        if(!skip){s=s*(1-a)+a*v;any=true}
      }
      p=addDays(pb[1],1);
    }
  }
  return any?s:null;
}
function insights(){
  const t=todayS(),ds=Object.keys(S.log).concat(Object.keys(S.mood)).sort();if(!ds.length)return[];
  const days=range(ds[0],t).filter(d=>!S.off[d]),out=[];
  const doneDay=(g,d)=>{const r=val(g.id,d);if(g.type==='qty')return r!=null?qtyOk(g,r):null;if(g.type==='range')return r!=null?evalRange(g,r).status==='ok':null;return num(r)>0};
  S.goals.forEach(g=>{
    if(isMeasure(g))return;const A=[],B=[];
    days.forEach(d=>{const m=S.mood[d];if(m==null)return;const x=doneDay(g,d);if(x==null)return;(x?A:B).push(m)});
    if(A.length>=5&&B.length>=5){const df=avg(A)-avg(B);if(Math.abs(df)>=.3)out.push({w:Math.abs(df)/4,t:'Nastrój w dni '+(g.type==='qty'||g.type==='range'?'z celem „'+g.name+'” w normie':'z: '+g.name),a:avg(A),b:avg(B),u:'',good:df>0,n:[A.length,B.length]})}
  });
  S.goals.filter(isCheck).forEach(c=>{
    S.goals.filter(r=>r.type==='range').forEach(r=>{
      const A=[],B=[];
      days.forEach(d=>{const n=addDays(d,1);if(n>t)return;const v=val(r.id,n);if(v==null)return;(num(val(c.id,d))>0?A:B).push(v)});
      if(A.length>=8&&B.length>=8){const df=avg(A)-avg(B),rel=Math.abs(df)/(r.ok||1);if(rel>=.6)out.push({w:rel/4,t:r.name+' następnego dnia po: '+c.name,a:avg(A),b:avg(B),u:' '+r.unit,good:null,n:[A.length,B.length]})}
    });
    const A=[],B=[];
    days.forEach(d=>{const n=addDays(d,1);if(n>t||S.mood[n]==null)return;(num(val(c.id,d))>0?A:B).push(S.mood[n])});
    if(c.type==='limit'&&A.length>=5&&B.length>=5){const df=avg(A)-avg(B);if(Math.abs(df)>=.3)out.push({w:Math.abs(df)/4,t:'Nastrój następnego dnia po: '+c.name,a:avg(A),b:avg(B),u:'',good:df>0,n:[A.length,B.length]})}
  });
  return out.sort((x,y)=>y.w-x.w).slice(0,6);
}
function ltCalc(x){
  const t=todayS(),end=x.to<t?x.to:t,g=S.goals.find(y=>y.id===x.goal);
  const total=Math.max(1,diffDays(x.from,x.to)),el=Math.min(total,Math.max(0,diffDays(x.from,end)+1)),frac=x.from>t?0:el/total;
  if(x.kind==='value'){if(!g)return null;const l=lastMeasure(g,t),cur=l?l.v:x.start,span=x.start-x.target,pr=span===0?1:Math.max(0,Math.min(1,(x.start-cur)/span));return{cur,pr,frac,txt:'teraz '+fmt(cur)+' '+g.unit+' · start '+fmt(x.start)+' · cel '+fmt(x.target)+' '+g.unit}}
  let cur;if(x.kind==='manual')cur=x.count||0;else{if(!g)return null;cur=x.from>t?0:sumRange(g.id,x.from,end)}
  const unit=x.kind==='manual'?(x.unit||''):g.type==='qty'?g.unit:'razy';
  return{cur,pr:Math.min(1,cur/x.target),frac,txt:fmt(cur)+' / '+fmt(x.target)+' '+unit,exp:x.target*frac};
}

}
function variantCounts(g,a,b){

function lenCounts(g,a,b){const o={s:0,m:0,l:0};range(a,b).forEach(d=>{const r=val(g.id,d);if(Array.isArray(r))r.forEach(e=>o[e.l]++)});return o}

function validGoal(g){

function summary(g){

  if(g.type==='do'){
    if(g.period==='day')return n+': codziennie. Zaliczone, gdy zaznaczysz dzień.'+vs;

  }

  if(g.type==='qty')return n+': co najmniej '+fmt(t)+' '+(g.unit||'')+' dziennie. Zaliczone, gdy dojdziesz do tej liczby.';
  if(g.type==='range')return n+': celujesz w '+fmt(t)+' '+(g.unit||'')+'. W normie do ±'+fmt(g.ok)+', trochę za mało lub za dużo do ±'+fmt(g.warn)+', dalej to już mocno za mało lub za dużo.';
  if(g.type==='limit'){const wl=Object.keys(g.w||{}).filter(k=>g.w[k]>1&&(g.variants||[]).includes(k)).map(k=>k.replace(/\s*\(.*?\)/,'')+' liczy się jak '+g.w[k]+' dni');return n+': do '+fmt(t)+' '+dni(t)+' '+PER[g.period]+' jest w porządku. Powyżej zaznaczę, że przegiąłeś.'+vs+(wl.length?' '+wl.join(', ')+'.':'')}

  return n+': '+what+' co najmniej '+fmt(t)+' '+raz(t)+' '+PER[g.period]+'. Przy każdym wpisie zaznaczasz długość.';

function weekSum(g,ws,we){

function monthBlock(g,a,b){
  const days=range(a,b),t=todayS();let lines='';
  const L=(s)=>{lines+='<div class="mline">'+s+'</div>'};
  if(isMeasure(g)){const v=days.map(d=>val(g.id,d)).filter(x=>x!=null);if(!v.length)L('Brak pomiarów');else{const f=v[0],l=v[v.length-1];L('Pomiarów: <b>'+v.length+'</b> · od <b>'+fmt(f)+'</b> do <b>'+fmt(l)+' '+esc(g.unit)+'</b> · zmiana <b>'+(l-f>0?'+':'')+fmt(l-f)+'</b>');if(g.target!=null)L('Cel: '+fmt(g.target)+' '+esc(g.unit)+' · zostało '+fmt(Math.abs(l-g.target)))}}

  else if(g.type==='do'||g.type==='contact'){

    if(g.type==='contact'){const lc=lenCounts(g,a,b);L('<b>'+tot+'</b> '+(g.kind==='call'?'rozmów':'spotkań')+' · krótko '+lc.s+' · średnio '+lc.m+' · długo '+lc.l)}
    else L('<b>'+tot+'</b> '+raz(tot));
    if(hasTarget(g)&&g.period==='week'){const ws=weeksIn(a,b).filter(w=>w<=t),hit=ws.filter(w=>sumRange(g.id,w,addDays(w,6))>=g.target).length;L('Tygodnie z celem ('+g.target+'+): <b>'+hit+'/'+ws.length+'</b> · średnio <b>'+fmt(tot/Math.max(1,days.length)*7)+'</b> na tydzień')}
    if(g.period==='month'&&hasTarget(g))L(tot>=g.target?'<span class="st-ok">Cel miesięczny zaliczony</span>':'Cel miesięczny: '+tot+'/'+g.target);
    if(g.type==='contact'&&g.kind==='meeting'){const ps=peopleStats(a,b),k=Object.keys(ps).sort((x,y)=>ps[y].n-ps[x].n);if(k.length)L(k.map(p=>esc(p)+' <b>'+ps[p].n+'</b>').join(' · '))}
    if(g.type==='do'&&!hasTarget(g)){const l=lastDone(g);if(l)L('Ostatnio: '+shortDate(l))}
  }
  else if(g.type==='limit'){
    const tot=sumRange(g.id,a,b),ws=weeksIn(a,b).filter(w=>w<=t),over=g.period==='week'?ws.filter(w=>sumRange(g.id,w,addDays(w,6))>g.target).length:null;
    const rd=days.filter(d=>num(val(g.id,d))).length;
    L('<b>'+rd+'</b> '+dni(rd)+(rd!==tot?' (liczone jako '+tot+')':'')+(over!=null?' · tygodnie ponad limit: <b class="'+(over?'st-bad':'st-ok')+'">'+over+'/'+ws.length+'</b>':''));
  }
  else if(g.type==='qty'){
    const v=days.map(d=>val(g.id,d)).filter(x=>x!=null),tot=v.reduce((s,x)=>s+x,0),hit=v.filter(x=>qtyOk(g,x)).length;
    L('Razem <b>'+fmt(tot)+' '+esc(g.unit)+'</b> · średnio '+fmt(tot/Math.max(1,days.length))+' dziennie · cel w <b>'+hit+'</b> '+dni(hit));
  }
  else if(g.type==='range'){
    const v=days.map(d=>val(g.id,d)).filter(x=>x!=null);
    if(!v.length)L('Brak wpisów');
    else{

  const done=gs.filter(x=>x.c>=1).sort((x,y)=>W(y.g)-W(x.g)).map(x=>x.g.name);
  const weak=gs.filter(x=>x.c<.6).sort((x,y)=>(W(y.g)-W(x.g))||(x.c-y.c))[0];
  const b=[];
  if(pg!=null)b.push(good>pg?'O '+(good-pg)+' więcej niż tydzień wcześniej.':good<pg?'O '+(pg-good)+' mniej niż tydzień wcześniej.':'Tyle samo co tydzień wcześniej.');
  if(done.length)b.push('Zaliczone: '+done.slice(0,3).join(', ')+(done.length>3?' i '+(done.length-3)+' więcej':'')+'.');
  if(weak)b.push('Do poprawy: '+weak.g.name+'.');
  const st=streak();if(st>=2&&e>=addDays(we,-1))b.push('Seria: '+st+' dni.');
  return{t:'Twój tydzień: dobre dni '+good+' z '+n,b:b.join(' '),g:good,n};
}
/* ---------- kamienie milowe ---------- */
const Ms=(()=>{
  const CNT=[10,25,50,100,150,200,300,400,500,750,1000,1500,2000,3000];
  const RUN=[7,14,21,30,50,75,100,150,200,250,300,365,500,730,1000];
  const GD=[10,25,50,100,200,300,500,750,1000,1500,2000];
  function sums(min){const o=[];for(let p=1;p<=1e7&&o.length<12;p*=10)for(const x of[1,2.5,5]){const v=x*p;if(v>=min&&o.length<12)o.push(v)}return o}
  const plG=(n,a,b,c)=>n===1?a:(n%10>=2&&n%10<=4&&(n%100<12||n%100>14))?b:c;
  function compute(){
    const t=todayS(),first=Object.keys(S.log).sort()[0];if(!first)return[];
    const out=[];
    const mk=(id,steps,label)=>{const x={id,steps,label,cur:0,max:0,reached:{}};out.push(x);return x};
    const hit=(x,v,d)=>{x.cur=v;if(v>x.max){x.max=v;for(const n of x.steps){if(n>v)break;if(!x.reached[n])x.reached[n]=d}}};
    const gd=mk('gd',GD,n=>n+' dobrych dni łącznie'),st=mk('st',RUN,n=>'Seria '+n+' dni');
    const G=S.goals.map(g=>{
      const o={g,n:0,sum:0,run:0};
      if(g.type==='do')o.c=mk(g.id+'-c',CNT,n=>g.name+': '+n+' '+(g.period==='day'?(n===1?'dzień':'dni'):(n===1?'raz':'razy')));
      else if(g.type==='qty'&&!isMax(g)){o.c=mk(g.id+'-c',CNT,n=>g.name+': '+n+' dni z celem');if(g.target>0)o.s=mk(g.id+'-s',sums(g.target*10),n=>g.name+': łącznie '+fmt(n)+(g.unit?' '+g.unit:''))}
      else if(g.type==='qty')o.c=mk(g.id+'-c',CNT,n=>g.name+': '+n+' dni w limicie');
      else if(g.type==='range')o.c=mk(g.id+'-c',CNT,n=>g.name+': '+n+' dni w normie');
      else if(g.type==='contact')o.c=mk(g.id+'-c',CNT.slice(0,9),n=>g.name+': '+n+' '+(g.kind==='call'?plG(n,'rozmowa','rozmowy','rozmów'):plG(n,'spotkanie','spotkania','spotkań')));
      else if(g.type==='limit')o.r=mk(g.id+'-r',RUN,n=>g.name+': '+n+' dni bez');
      return o});
    let ng=0,run=0;
    for(const d of range(first,t)){
      const L=S.log[d]||{},active=Object.keys(L).length>0||S.mood[d]!=null;
      if(!S.off[d]){if(goodDay(d)){ng++;hit(gd,ng,d);run++;hit(st,run,d)}else if(d!==t){run=0;st.cur=0}}
      G.forEach(o=>{const g=o.g,v=L[g.id];
        if(o.c){let inc=0;
          if(g.type==='do')inc=num(v)>0?1:0;
          else if(g.type==='contact')inc=num(v);
          else if(g.type==='range')inc=v!=null&&evalRange(g,v).status==='ok'?1:0;
          else if(isMax(g))inc=v!=null&&v<=g.target?1:0;
          else inc=v!=null&&g.target>0&&num(v)>=g.target?1:0;
          if(inc){o.n+=inc;hit(o.c,o.n,d)}}
        if(o.s&&typeof v==='number'&&v>0){o.sum+=v;hit(o.s,o.sum,d)}
        if(o.r&&active&&!S.off[d]&&!pausedAt(g,d)){if(num(v)>0){o.run=0;o.r.cur=0}else{o.run++;hit(o.r,o.run,d)}}
      });
    }
    return out;
  }
  function check(){
    if(!S)return;if(!S.ms||typeof S.ms!=='object'){S.ms={};S.msInit=false}
    let all;try{all=compute()}catch(e){return}
    const init=!S.msInit,t=todayS(),nw=[];let ch=false;
    all.forEach(x=>Object.keys(x.reached).forEach(n=>{const k=x.id+'-'+n;if(S.ms[k])return;const m={d:x.reached[n],t:x.label(+n),at:t};if(init)m.q=1;else nw.push(m);S.ms[k]=m;ch=true}));
    if(init){S.msInit=true;ch=true}
    if(!ch)return;
    nw.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0).slice(3).forEach(m=>{m.q=1});
    Sync.save();if(ui.tab==='charts'&&!ui.sheet)render();
    if(nw.length){toast('Kamień milowy: '+nw.sort((a,b)=>a.d<b.d?1:-1)[0].t+'!');Asst.paint()}
  }
  const short=k=>{const n=+k.split('-').pop();return n>=1e6?String(n/1e6).replace('.',',')+' mln':n>=1e4?String(n/1e3).replace('.',',')+'k':String(n)};
  function card(){
    let all=[];try{all=compute()}catch(e){}
    const got=Object.keys(S.ms||{}).map(k=>Object.assign({k},S.ms[k])).sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);
    const next=[];all.forEach(x=>{const n=x.steps.find(v=>!x.reached[v]);if(n&&x.cur>0)next.push({t:x.label(n),cur:x.cur,n,r:x.cur/n})});
    next.sort((a,b)=>b.r-a.r);
    let h='<div class="card"><h3>Kamienie milowe</h3><p class="sub">Okrągłe liczby i serie, np. 50. trening, 1000 stron albo 30 dobrych dni z rzędu. Pixa da znać, gdy zdobędziesz kolejny.</p>';
    if(next.length)h+='<div class="msh">Najbliżej</div>'+next.slice(0,3).map(x=>'<div class="msn"><div class="msr"><span>'+esc(x.t)+'</span><b>'+fmt(x.cur)+'/'+fmt(x.n)+'</b></div><div class="bar-o"><div class="bar-i" style="width:'+Math.min(100,Math.round(x.r*100))+'%"></div></div></div>').join('');
    if(got.length){const show=ui.msAll?got:got.slice(0,5);h+='<div class="msh">Zdobyte: '+got.length+'</div>'+show.map(m=>'<div class="msg"><span class="medal" aria-hidden="true">'+short(m.k)+'</span><span class="mst">'+esc(m.t)+'<small>'+shortDate(m.d)+'</small></span></div>').join('')+(got.length>5?'<button class="link" style="margin-top:6px" data-act="msall">'+(ui.msAll?'Pokaż mniej':'Pokaż wszystkie ('+got.length+')')+'</button>':'')}
    else h+='<p class="gs" style="margin:6px 0 0">Pierwszy kamień milowy, np. 10 treningów albo seria 7 dni, pojawi się tutaj.</p>';
    return h+'</div>';
  }
  return{compute,check,card};
})();

function goalDesc(g){const r=goalRuns(g),pl=scorable(g)?PRL[g.prio||'imp']+' · ':'',gn=(g.groups||[]).length;return pl+(catOk(g)?esc(CAT_BY[g.act].n)+' · ':'')+goalDesc0(g)+(gn?' · widoczny dla '+gn+' '+(gn===1?'grupy':'grup'):'')+(r&&r.best>=2?' · rekord serii: '+r.best+' '+r.ub:'')}
function goalDesc0(g){
  if(isMeasure(g))return'pomiar '+PER[g.period]+(g.target!=null?' · cel '+fmt(g.target)+' '+esc(g.unit):'');
  if(g.type==='range')return'wartość: '+fmt(g.target)+' '+esc(g.unit)+' ±'+fmt(g.ok);
  if(g.type==='qty')return(isMax(g)?'maks. ':'min. ')+fmt(g.target)+' '+esc(g.unit)+' dziennie';
  if(g.type==='limit')return'limit: max '+fmt(g.target)+' '+dni(g.target)+' '+PER[g.period]+(g.variants.length?' · '+g.variants.length+' poziomy':'');
  if(g.type==='contact')return(g.kind==='call'?'rozmowy':'spotkania')+(hasTarget(g)?': min. '+g.target+' '+PER[g.period]:', bez celu');
  if(g.period==='day')return'codziennie'+(g.variants.length?' · '+g.variants.length+' rodzajów':'');
  return(hasTarget(g)?'min. '+g.target+' '+dni(g.target)+' '+PER[g.period]:'bez celu, tylko zapis')+(g.variants.length?' · '+g.variants.length+' rodzajów':'');
}

  const g=id?JSON.parse(JSON.stringify(S.goals.find(x=>x.id===id))):{id:'g'+Date.now(),name:'',cat:cats()[0]||'',type:'do',period:'week',target:3,variants:[],prio:'imp',groups:[]};

function defaults(g,type){
  const prev=g.type;g.type=type;
  if(type==='do'||type==='limit')g.variants=g.variants||[];
  if(type==='do'){g.period=['day','week','month'].includes(g.period)?g.period:'week';if(g.period==='day')g.target=1;else if(prev!=='do')g.target=3}
  if(type==='limit'){g.period=g.period==='month'?'month':'week';g.w=g.w||{};if(!(g.target>0)||prev!=='limit')g.target=2}
  if(type==='qty'){g.period='day';if(prev!=='qty'){g.target=20;g.unit='stron';g.dir=undefined}}
  if(type==='range'){g.period='day';if(prev!=='range'){g.target=7.5;g.unit='h';g.ok=.5;g.warn=1.5}}
  if(type==='measure'){g.period=['day','week','month'].includes(g.period)?g.period:'week';if(prev!=='measure'){g.unit='kg';g.target=null}}
  if(type==='contact'){g.period=g.period==='month'?'month':'week';g.kind=g.kind||'meeting';if(prev!=='contact')g.target=null}
}

/* ---------- znajomi: grupy, udostępnianie, ranking, wyzwania, piątki ---------- */
const Social=(()=>{
  let D=fresh(),lastSig='',timer=null,pendingJoin=null,busy=false;
  function fresh(){return{loaded:false,loading:false,err:null,profile:null,groups:[],members:[],profiles:{},shares:[],challenges:[],kudos:[]}}

  async function load(){

      const q=[sb().from('rytm_profile').select('user_id,name').eq('user_id',me()).maybeSingle(),sb().from('rytm_group').select('id,name,code,created_by'),sb().from('rytm_member').select('group_id,user_id,role'),sb().from('rytm_share').select('user_id,goal_id,act,name,groups,data,updated_at'),sb().from('rytm_challenge').select('id,group_id,name,act,target,start_day,end_day,created_by').order('start_day',{ascending:false}),sb().from('rytm_kudos').select('from_user,to_user,act,day,created_at').order('created_at',{ascending:false}).limit(60)];
      const [p,g,m,sh,ch,kd]=await Promise.all(q);

      D.profile=p.data;D.groups=g.data||[];D.members=m.data||[];D.shares=sh.data||[];D.challenges=ch.data||[];D.kudos=kd.data||[];

      if(ids.length){const pr=await sb().from('rytm_profile').select('user_id,name').in('user_id',ids);if(pr.error)throw pr.error;(pr.data||[]).forEach(x=>{D.profiles[x.user_id]=x.name})}

  }
  function doneDay(g,d){const r=val(g.id,d);if(g.type==='qty')return r!=null&&qtyOk(g,r);if(g.type==='range')return r!=null&&evalRange(g,r).status==='ok';return num(r)>0}

  function shareData(g){
    const t=todayS(),days=range(addDays(t,-119),t).filter(d=>!pausedAt(g,d)&&doneDay(g,d)),weeks={};
    for(let i=25;i>=0;i--){const w=addDays(wstart(t),-7*i),c=goalCompletion(g,w,addDays(w,6));if(c!=null)weeks[w]=c>=1?1:0}
    return{days,weeks,target:targetLabel(g)};
  }
  function queueShares(){clearTimeout(timer);timer=setTimeout(syncShares,1500)}
  async function syncShares(){

    const sig=JSON.stringify(rows);if(sig===lastSig)return;
    try{
      const now=new Date().toISOString();rows.forEach(r=>{r.updated_at=now});
      if(rows.length){const r=await sb().from('rytm_share').upsert(rows,{onConflict:'user_id,goal_id'});if(r.error)throw r.error}
      let del=sb().from('rytm_share').delete().eq('user_id',me());
      if(rows.length)del=del.not('goal_id','in','('+rows.map(r=>'"'+r.goal_id.replace(/"/g,'')+'"').join(',')+')');

  const daysIn=(sh,a,b)=>((sh.data&&sh.data.days)||[]).filter(d=>d>=a&&d<=b).length;
  const sentToday=(to,act)=>D.kudos.some(k=>k.from_user===me()&&k.to_user===to&&k.act===act&&k.day===todayS());
  function groupShares(gid){const mem=D.members.filter(m=>m.group_id===gid).map(m=>m.user_id);return D.shares.filter(x=>(x.groups||[]).includes(gid)&&mem.includes(x.user_id))}
  function rankingCard(g){

      return'<div class="rk'+(r.uid===me()?' me':'')+'"><span class="rkn">'+pos+'</span><div class="rkm"><b>'+esc(name(r.uid))+'</b><small>cel: '+esc(r.x.data.target||'?')+(stale?' · dane sprzed '+diffDays(String(r.x.updated_at).slice(0,10),t)+' dni':'')+'</small></div><span class="rkv">'+r.v+' <small>'+unit(r.v)+'</small></span>'+(r.uid===me()?'<span class="rkk"></span>':'<button class="btn rkk" data-soc="kudos" data-to="'+r.uid+'" data-a="'+act+'"'+(sentToday(r.uid,act)?' disabled':'')+'>'+(sentToday(r.uid,act)?'Wysłano':'Piątka')+'</button>')+'</div>'}).join('');
    if(missing>0)h+='<p class="gs" style="margin:8px 0 0">'+missing+' '+(missing===1?'osoba nie udostępnia':'osoby nie udostępniają')+' tej aktywności.</p>';
    return h+'</div>';
  }
  function challengesCard(g){
    const list=D.challenges.filter(c=>c.group_id===g.id),sh=groupShares(g.id),t=todayS();
    let h='<div class="card"><div class="cath" style="margin:0 0 6px"><h3>Wspólne wyzwania</h3><button class="caltog" data-soc="newch" data-g="'+g.id+'">+ Nowe</button></div>';

  function draw(cv,f,pname,cur,palName){

    // nogi
    let [l0,l1,r0,r1]=[q.ll0,q.ll1,q.rl0,q.rl1];if(P.swing){const w=Math.sin(f*.3)*14;l1+=w;r1-=w}
    [[hip(-1),l0,l1,-1],[hip(1),r0,r1,1]].forEach(([h,a0,a1,sd])=>{const [d0x,d0y]=dir(a0),kn=[h[0]+d0x*18,h[1]+d0y*18],[d1x,d1y]=dir(a0+a1),an=[kn[0]+d1x*18,kn[1]+d1y*18],[fx,fy]=dir(a0+a1+sd*40);
      seg(h,kn,4.4,2.9);seg(kn,an,2.7,1.5);for(let k=1;k<=4;k++)px(an[0]+fx*k,an[1]+fy*k,k<3?'shade':'edge');
      const ab=[kn[0]+d1x*15,kn[1]+d1y*15];for(let o=-2;o<=2;o++)px(ab[0]+d1y*o,ab[1]-d1x*o,'acc');px(kn[0],kn[1],'core');px(kn[0]+1,kn[1],'acc');px(kn[0],kn[1]+1,'acc')});
    // tułów: ramiona, biust, talia, biodra
    const prof=s=>s<.25?6.4+.6*(s/.25):s<.6?7-3.3*((s-.25)/.35):3.7+4.6*((s-.6)/.4);
    for(let i=0;i<=46;i++){const s=i/46,w=prof(s);for(let o=-w;o<=w+.01;o+=.5){const p=at(s,o);px(p[0],p[1],tone(o,w))}}
    [-1,1].forEach(sd=>{for(let a=-3;a<=3;a++){const p=at(.29+Math.abs(a)*.006,sd*3.4+a*.6);px(p[0],p[1]-(3-Math.abs(a))*.4,Math.abs(a)<2?'core':'body')}for(let a=-2;a<=2;a++){const p=at(.37,sd*3.4+a*.8);px(p[0],p[1],'shade')}});
    [-1,1].forEach(sd=>{for(let i=0;i<5;i++){const p=at(.04+i*.004,sd*(1.5+i));px(p[0],p[1],'core')}});
    for(let i=0;i<14;i++){const s=.4+i*.037;[-1,1].forEach(sd=>{if(i%2===0){const p=at(s,sd*(prof(s)-2.2));px(p[0],p[1],'acc')}})}
    for(let o=-8;o<=8;o+=.5){const p=at(.88,o);px(p[0],p[1],'acc');const p2=at(.9,o);px(p2[0],p2[1],'lip')}
    {const e=at(.15,0),pl=f%20<10;[[0,0],[0,-1],[0,1],[-1,0],[1,0],[0,-2],[0,2]].forEach(([dx,dy],i)=>{if(i<5||pl)px(e[0]+dx,e[1]+dy,i===0?'core':'acc')})}
    // szyja

    if(P.cheer){b0+=Math.abs(Math.sin(f*.5))*-25;b1+=Math.abs(Math.sin(f*.5))*30}

    const hands=[];

      seg(s,e,2.4,1.9);seg(e,hd,1.8,1.1);px(e[0],e[1],'core');px(e[0]+1,e[1],'acc');px(s[0],s[1],'core');const wr=[e[0]+vx*11.5,e[1]+vy*11.5];for(let o=-2;o<=2;o++)px(wr[0]+vy*o,wr[1]-vx*o,'acc');
      for(let k=0;k<4;k++){px(hd[0]+vx*k,hd[1]+vy*k,k<2?'body':'shade');px(hd[0]+vx*k+vy,hd[1]+vy*k-vx,'edge')}px(hd[0]+vx*1-vy*2,hd[1]+vy*1+vx*2,'shade');hands.push([hd[0]+vx*3,hd[1]+vy*3])});
    // stawy jako świecące węzły

    const ey=Hd[1]-1;
    for(let y=-11;y<=12;y++)for(let x=-9;x<=9;x++){const rx=y>2?8.2*(1-.42*((y-2)/10)):8.2,ry=y>0?12:11,d=(x*x)/(rx*rx)+(y*y)/(ry*ry);if(d>1)continue;
      const bx=1.5-y*.28;px(Hd[0]+x,Hd[1]+y,d>.86?'edge':Math.abs(x-bx)<.6&&y>-6&&y<7?'edge':x>bx?'shade':(x<-5&&y<-3)?'core':'body')}

    for(let y=-12;y<=-7;y++)for(let x=-9;x<=9;x++){const d=(x*x)/70+(y*y)/128;if(d>1.04||y>-7-(Math.abs(x)>6?1:0))continue;px(Hd[0]+x,Hd[1]+y,(x*3+y+Math.floor(f/3))%7===0?'hairB':y<-9?'hairD':'hairA')}
    // pasma danych w górę, zawsze w ruchu, z odrywającymi się drobinkami

    const tips=[];
    for(let i=0;i<19;i++){const r=i/18,bxx=-9+r*18,base=[Hd[0]+bxx,Hd[1]-Math.sqrt(Math.max(0,1-(bxx/8.6)**2))*10.5];
      const sg=r<.5?1:-1,off=Math.abs(r-.5)*2,L=26+((i*5)%4)*3+Math.round(Math.sin(f*.08+i)*3)+Math.round(off*3);let a=sg*off*6+Math.sin(f*.15+i*1.3)*1.5*off,x=base[0],y=base[1];
      for(let k=0;k<L;k++){a+=sg*off*.14+Math.sin(f*.2+k*.25+i)*.6*Math.max(.25,off);a=off<.06?Math.max(-1,Math.min(1,a)):sg*Math.max(0,Math.min(10,a*sg));const[ddx,ddy]=dir(180+a);x+=ddx;y+=ddy;
        const n=k<L*.3?'hairA':k<L*.68?'hairM':'hairB';
        if(k<L*.4){px(x,y,n);px(x+(r<.5?-1:1),y,k%4===0?'hairD':n)}
        else if(((k-f*1.3+i*5)%6+6)%6<4)px(x,y,n);
        else if(((k-f*1.3+i*5)%6+6)%6<5)px(x,y,'core')}
      tips.push([x,y,(r-.5)])}
    const upd=()=>{st.p.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.97;p.life--});st.p=st.p.filter(p=>p.life>0);
      tips.forEach(([x,y,s2],i)=>{if(Math.random()<.32)st.p.push({x,y,vx:s2*.35+(Math.random()-.5)*.35,vy:-.5-Math.random()*.6,life:12+Math.floor(Math.random()*18),max:30,c:Math.random()<.25?'core':Math.random()<.5?'hairB':'hairM'})})};

  }

})();

/* ---------- asystentka Pixa (podpowiedzi oparte na regułach, bez AI) ---------- */
const Asst=(()=>{
  // Pozy: losowe co kilka sekund, dopasowane do treści podpowiedzi, reakcja na dotknięcie.
  const POOL=['float','stand','sleep','perch','orb','peek','stretch','float','stand','dance'];
  const CTX={mood:'wave',start:'wave',missing:'think',review:'think',adjust:'think',limit:'think',paused:'think',record:'jump',insight:'orb',milestone:'cheer',weekly:'wave'};

      const r=goalRuns(g);if(r&&r.cur>=3&&r.cur===r.best)add('rec-'+g.id+'-'+r.cur,'record',35,'„'+g.name+'”: '+r.cur+' '+r.u+' z rzędu. To Twój rekord!',[{l:'Dzięki!',f:()=>{}}]);

    // wniosek z danych
    try{const ins=insights().find(x=>x.good===true);if(ins)add('ins-'+ins.t,'insight',20,'Zauważyłam coś w Twoich danych. '+ins.t+': średnio '+fmt(ins.a)+ins.u+', a bez tego '+fmt(ins.b)+ins.u+'.',[{l:'Ciekawe',f:()=>{}}])}catch(e){}
    return out.sort((a,b)=>b.pr-a.pr);
  }
  function snooze(tp){const days=tp.kind==='mood'||tp.kind==='missing'||tp.kind==='yesterday'||tp.kind==='streak'?1:tp.kind==='adjust'||tp.kind==='limit'?7:14;S.asst.snooze[tp.id]=addDays(todayS(),days);save()}
  function paint(){
    const pv=document.getElementById('pxprev');if(pv&&S)PixaArt.draw(pv,14,'wave',null,S.settings.pixaPal);
    const root=document.getElementById('asst');if(!root)return;
    if(anim){cancelAnimationFrame(anim);anim=null}
    if(!S||!S.settings.asst||ui.sheet||ui.tab==='settings'||(ui.tour!=null&&!ui.tourLens)){root.innerHTML='';return}
    tipsCache=tips();if(idx>=tipsCache.length)idx=0;
    if(ui.asstKind){const j=tipsCache.findIndex(x=>x.kind===ui.asstKind);if(j>=0)idx=j;ui.asstKind=null}
    const has=tipsCache.length>0||!!ui.fdone,fresh=(has&&!openedToday())||!!ui.fdone||tipsCache.some(x=>x.kind==='milestone');
    if(!ui.asstOpen){
      root.innerHTML='<button class="hal'+(fresh?' on':'')+'" data-asst="open" aria-label="'+(has?'Pixa ma dla Ciebie '+tipsCache.length+' '+(tipsCache.length===1?'wiadomość':'wiadomości'):'Otwórz asystentkę Pixę')+'"><span class="lens"></span></button>';
      return;
    }
    const mode=ui.ck?'ck':(ui.fset||focus||ui.fdone)?'focus':ui.breath?'breath':null;
    const tp=mode?null:tipsCache[idx];
    let bub;
    if(mode==='ck')bub=ckBubble();
    else if(mode==='focus')bub=focusBubble();
    else if(mode==='breath')bub=breathBubble();
    else if(!tp)bub='<p class="pxtxt">Wszystko gra. Nie mam teraz żadnych pytań. Zajrzę, gdy coś zauważę.</p>';
    else bub='<p class="pxtxt">'+esc(tp.text)+'</p><div class="pxact">'+(tp.actions[0]&&tp.actions[0].mood?tp.actions.map((a,j)=>'<button class="mb md'+a.mood+'" data-asst="do" data-j="'+j+'" aria-label="'+esc(a.l)+'"><b>'+a.mood+'</b></button>').join(''):tp.actions.map((a,j)=>'<button class="btn main" data-asst="do" data-j="'+j+'">'+esc(a.l)+'</button>').join(''))+'</div><div class="pxfoot"><button class="link" data-asst="later">Nie teraz</button><button class="link" data-asst="never">Nie pokazuj takich</button>'+(tipsCache.length>1?'<button class="link pxnext" data-asst="next">'+(idx+1)+'/'+tipsCache.length+' ›</button>':'')+'</div>';
    root.innerHTML='<div class="pxpanel" role="dialog" aria-label="Pixa, asystentka"><div class="pxavw"><canvas class="pxav" width="88" height="126" data-asst="poke" role="img" aria-label="Pixa"></canvas></div><div class="pxbub"><div class="pxhead"><span class="pxname">Pixa</span>'+(mode?'':'<span class="pxtools"><button data-asst="ftool">Minutnik</button><button data-asst="btool">Oddech</button></span>')+'</div>'+bub+'</div><button class="pxclose" data-asst="close" aria-label="Zamknij asystentkę">×</button></div>';
    const cv=root.querySelector('.pxav');
    if(!mode)setCtx(tp);
    if(reduced()){PixaArt.draw(cv,0,ctxPose||'stand',null,S.settings.pixaPal);return}
    let last=0;const loop=ts=>{if(ts-last>100){last=ts;step(cv)}anim=requestAnimationFrame(loop)};anim=requestAnimationFrame(loop);
  }
  document.addEventListener('click',e=>{
    const el=e.target.closest('[data-asst]');if(!el)return;const a=el.dataset.asst,tp=tipsCache[idx];
    if(a==='open'){ui.asstOpen=true;idx=0;try{localStorage.setItem(openedKey,todayS())}catch(x){}paint()}
    if(a==='close'){ui.asstOpen=false;ui.ck=null;ui.fset=null;ui.fdone=null;if(ui.breath&&!bPhase())ui.breath=null;paint()}
    if(a==='ftool'){ui.ck=null;ui.breath=null;ui.fdone=null;if(!focus)ui.fset={g:(S.goals.find(g=>isMin(g)&&!isPaused(g))||{}).id||null,m:25};paint();return}
    if(a==='btool'){ui.ck=null;ui.fset=null;ui.fdone=null;ui.breath={start:Date.now()};choose('breathe');pokeT=0;paint();return}
    if(a==='fgoal'){ui.fset.g=el.dataset.g||null;paint();return}
    if(a==='fmin'){ui.fset.m=+el.dataset.m;paint();return}
    if(a==='fstart'){fStart();paint();return}
    if(a==='fpause'&&focus){if(focus.paused){focus.end=Date.now()+focus.left;focus.paused=false;wake(true)}else{focus.left=fLeft();focus.paused=true;wake(false)}fSave();paint();return}
    if(a==='fend'&&focus){fFinish();if(ui.tab==='today')render();else paint();return}
    if(a==='fcancel'){focus=null;fSave();wake(false);react(null,null);paint();return}
    if(a==='fclose'){ui.fdone=null;ui.fset=null;paint();return}
    if(a==='fsave'&&ui.fdone){const v=parseNum((document.getElementById('fin')||{}).value);if(v==null){toast('Wpisz liczbę.');return}const id=ui.fdone.ask,d=todayS();setVal(id,d,(num(val(id,d))||0)+v);save();ui.fdone.ask=null;ui.fdone.saved=fmt(v)+' '+((S.goals.find(x=>x.id===id)||{}).unit||'');react(null,{mood:5});if(ui.tab==='today')render();else paint();return}
    if(a==='bstart'){ui.breath={start:Date.now()};choose('breathe');pokeT=0;paint();return}
    if(a==='bclose'){ui.breath=null;react(null,null);paint();return}
    if(a==='bmood'){const v=+el.dataset.v;S.mood[todayS()]=v;save();ui.breath=null;react(null,{mood:v});toast('Zapisano nastrój.');if(ui.tab==='today')render();else paint();return}
    if(ui.ck){
      if(a==='ckv')ckAnswer(parseNum(el.dataset.v),'val');
      if(a==='ckyes')ckAnswer(1,'yes');
      if(a==='ckno'||a==='ckskip')ckAnswer(null,'no');
      if(a==='cksave'){const v=parseNum((document.getElementById('ckin')||{}).value);if(v==null){toast('Wpisz liczbę.');return}ckAnswer(v,'val')}
      if(a==='ckend'){ui.ck=null;react(null,{mood:5});if(ui.tab==='today')render();else paint()}
      return;
    }
    if(a==='poke'){poke()}
    if(a==='next'){idx=(idx+1)%tipsCache.length;react(null,null);paint()}
    if(a==='later'&&tp){react(tp,null);snooze(tp);paint()}
    if(a==='never'&&tp){react(tp,null);S.asst.off[tp.kind]=true;save();toast('Nie pokażę już takich podpowiedzi. Przywrócisz je w Ustawieniach.');paint()}
    if(a==='do'&&tp){const ac=tp.actions[+el.dataset.j];if(tp.kind==='adjust'||tp.kind==='paused'){const u=withUndo('Zmieniono cel.');setTimeout(u,0)}react(tp,ac);S.asst.snooze[tp.id]=addDays(todayS(),3650);ac.f();save();if(ui.tab==='today'||ui.tab==='settings'||ui.tab==='goals')render();else paint()}
  });
  return{paint,tips,rescue};
})();

/* ---------- przewodnik dla nowych osób (prowadzi Pixa) ---------- */
const Tour=(()=>{
  const ios=()=>/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  const standalone=()=>(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
  const ST=[
    {tab:'today',pose:'wave',h:'Cześć, jestem Pixa!',p:'Pokażę Ci Rytm w minutę. Możesz w każdej chwili pominąć.'},
    {tab:'today',hl:'.nav [data-t=today]',pose:'stand',h:'Dziś',p:'Tu codziennie zaznaczasz cele. Jedno dotknięcie to „zrobione”, a liczby (np. strony albo godziny snu) wpisujesz w pole. Na górze zapisujesz nastrój, a strzałkami przy dacie uzupełnisz wcześniejsze dni.'},
    {tab:'today',hl:'#app .tiles',pose:'jump',h:'Dobry dzień i seria',p:'Gdy zrobisz wystarczająco dużo (na start 70%, cele główne liczą się potrójnie), dzień jest dobry. Dobre dni z rzędu to Twoja seria. Choroba? Włącz „Dzień wolny”, a seria się nie przerwie.'},
    {tab:'cal',hl:'.nav [data-t=cal]',pose:'think',h:'Kalendarz',p:'Tydzień i miesiąc w kratkach. Dotknij dnia, żeby zobaczyć szczegóły albo coś dopisać.'},
    {tab:'charts',hl:'.nav [data-t=charts]',pose:'orb',h:'Wykresy',p:'Jak idą Twoje cele w czasie, co Ci pomaga i Twoje kamienie milowe, np. 50. trening albo 30 dni serii.'},
    {tab:'friends',hl:'.nav [data-t=friends]',pose:'dance',h:'Znajomi',p:'Załóż grupę albo dołącz kodem od znajomego. Udostępniasz tylko wybrane cele z ruchu i nauki. Notatki, nastrój i osoby zostają tylko u Ciebie.'},
    {tab:'goals',hl:'.nav [data-t=goals]',pose:'stretch',h:'Cele',p:'Tu dodajesz, zmieniasz i wstrzymujesz cele. Wpisz nazwę po swojemu, a ja rozpoznam, co to za aktywność.'},
    {tab:'today',hl:'#asst .hal',lens:true,pose:'peek',h:'Tu mnie znajdziesz',p:'Czerwona soczewka w rogu to ja. Świecę mocniej, gdy mam pytanie albo pomysł. W środku są też minutnik skupienia i minuta oddechu. Niczego nie zmieniam bez Twojej zgody.'},
    {tab:'settings',sec:'pixa',hl:'#pushbox',scroll:true,pose:'cheer',h:'Przypomnienia',p:()=>ios()&&!standalone()?'Na iPhonie przypomnienia działają tylko z ikony na ekranie głównym. W Safari dotknij Udostępnij, potem „Do ekranu początkowego”. Otwórz Rytm z nowej ikony i włącz przypomnienia tutaj.':'Włącz przypomnienia na tym urządzeniu przyciskiem powyżej. Dam znać wieczorem, jeśli czegoś brakuje, a w poniedziałek podsumuję tydzień.'}
  ];
  let tm=null,fr=0;
  function go(i){
    const s=ST[i];ui.tour=i;ui.tourLens=!!s.lens;ui.asstOpen=false;ui.sheet=null;ui.confirm=null;
    ui.tab=s.tab==='cal'?(ui.calLast||'week'):s.tab;if(s.tab==='today')ui.date=todayS();if(s.sec)ui.setSec=s.sec;
    render();const el=s.scroll?document.querySelector(s.hl):null;if(el){el.scrollIntoView({block:'start'});window.scrollBy(0,-80)}else window.scrollTo(0,0);
  }
  function end(){ui.tour=null;ui.tourLens=false;S.tour='done';save();ui.tab='today';ui.date=todayS();render();window.scrollTo(0,0);toast('Przewodnik znajdziesz w Ustawieniach, w sekcji Pixa.')}
  function paint(){
    const root=document.getElementById('tour');if(!root)return;
    document.querySelectorAll('.tourhl').forEach(e=>e.classList.remove('tourhl'));
    if(ui.tour==null||!S||ui.sheet){root.innerHTML='';if(tm){clearInterval(tm);tm=null}return}
    const i=ui.tour,s=ST[i],p=typeof s.p==='function'?s.p():s.p,last=i===ST.length-1;
    root.innerHTML='<div class="pxpanel tour'+(s.lens?' up':'')+'" role="dialog" aria-label="Przewodnik po aplikacji"><div class="pxavw"><canvas class="pxav" width="88" height="126" role="img" aria-label="Pixa"></canvas></div><div class="pxbub"><div class="pxhead"><span class="pxname">Pixa</span><span class="tstep">'+(i+1)+' z '+ST.length+'</span></div><p class="pxtxt"><b>'+esc(s.h)+'</b><br>'+esc(p)+'</p><div class="pxact"><button class="btn main" data-tour="next">'+(last?'Gotowe':i===0?'Pokaż':'Dalej')+'</button>'+(i>0?'<button class="btn" data-tour="back">Wstecz</button>':'')+'</div>'+(last?'':'<div class="pxfoot"><button class="link" data-tour="skip">Pomiń przewodnik</button></div>')+'</div></div>';
    if(s.hl){const el=document.querySelector(s.hl);if(el)el.classList.add('tourhl')}
    const pal=S.settings.pixaPal,draw=()=>{const c=document.querySelector('#tour canvas');if(!c||ui.tour==null){clearInterval(tm);tm=null;return}PixaArt.draw(c,fr++,ST[ui.tour].pose,null,pal)};
    if(tm){clearInterval(tm);tm=null}draw();
    if(!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches))tm=setInterval(draw,110);
  }
  document.addEventListener('click',e=>{const el=e.target.closest('[data-tour]');if(!el||ui.tour==null)return;const a=el.dataset.tour;
    if(a==='skip')end();else if(a==='back'&&ui.tour>0)go(ui.tour-1);else if(a==='next'){if(ui.tour>=ST.length-1)end();else go(ui.tour+1)}});
  return{go,paint,end,steps:ST.length};
})();

document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target)return;const b=e.target.id==='ckin'?document.querySelector('[data-asst=cksave]'):e.target.id==='fin'?document.querySelector('[data-asst=fsave]'):null;if(b)b.click()});
const Push=(()=>{
  let st='checking',msg=null;
  const ios=/iPhone|iPad|iPod/.test(navigator.userAgent),standalone=window.navigator.standalone===true||window.matchMedia('(display-mode: standalone)').matches;
  const supported=()=>'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window;
  const b64=s=>{const r=atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/'));return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))};
  function err(e){
    const m=String((e&&(e.message||e.name))||e||'');
    if(/rytm_push|PGRST205|42P01/.test(m))return'Brakuje tabel przypomnień w bazie. Uruchom kod SQL z instrukcji (SQL Editor w Supabase).';
    if(/func|Functions|non-2xx|Failed to send/i.test(m))return'Usługa przypomnień nie odpowiada. Sprawdź, czy funkcja rytm-push jest wdrożona w Supabase i ma wyłączone „Verify JWT”.';
    if(/NotAllowed|denied/i.test(m))return'Urządzenie nie pozwoliło na powiadomienia.';
    return'Coś poszło nie tak: '+m;
  }
  async function check(){
    if(ios&&!standalone)st='ios-browser';
    else if(!supported())st='unsupported';
    else if(Notification.permission==='denied')st='denied';
    else{try{const reg=await navigator.serviceWorker.ready;st=(await reg.pushManager.getSubscription())?'on':'off'}catch(e){st='off'}}
    paint();
  }
  function paint(){const el=document.getElementById('pushbox');if(el)el.innerHTML=boxHtml()}
  function boxHtml(){
    if(st==='checking'){setTimeout(check,0);return'<p class="gs">Sprawdzam to urządzenie…</p>'}
    const M={
      'ios-browser':'<p class="gs" style="margin:0">Na iPhonie przypomnienia działają tylko w aplikacji dodanej do ekranu początkowego. W Safari kliknij <b>Udostępnij → Do ekranu początkowego</b>, otwórz Rytm z ikony i włącz przypomnienia tutaj.</p>',
      'unsupported':'<p class="gs" style="margin:0">Ta przeglądarka nie obsługuje powiadomień.</p>',
      'denied':'<p class="gs" style="margin:0">Powiadomienia są zablokowane. Na iPhonie: <b>Ustawienia → Powiadomienia → Rytm</b> i włącz. W przeglądarce: kłódka obok adresu → Powiadomienia → Zezwalaj.</p>',
      'on':'<p class="gs st-ok" style="margin:0 0 8px">Na tym urządzeniu przypomnienia są włączone.</p><div class="actions" style="margin-top:0"><button class="btn" data-push="test">Wyślij próbne</button><button class="btn" data-push="off">Wyłącz tutaj</button></div>',
      'off':'<button class="btn main" style="width:100%" data-push="on">Włącz przypomnienia na tym urządzeniu</button>'
    };
    return(M[st]||'')+(msg?'<p class="authmsg'+(msg.ok?' ok':'')+'" role="status">'+esc(msg.t)+'</p>':'');
  }
  async function on(){
    msg=null;
    try{
      const perm=await Notification.requestPermission();
      if(perm!=='granted'){st=perm==='denied'?'denied':'off';msg={t:'Bez zgody na powiadomienia przypomnienia nie przyjdą.'};return paint()}
      msg={t:'Włączam…',ok:true};paint();
      const sb=Sync.client(),{data,error}=await sb.functions.invoke('rytm-push',{body:{action:'public-key'}});
      if(error||!data||!data.publicKey)throw error||new Error('func');
      const reg=await navigator.serviceWorker.ready;
      let sub=await reg.pushManager.getSubscription();
      if(!sub)sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(data.publicKey)});
      const j=sub.toJSON(),r=await sb.from('rytm_push').upsert({user_id:Sync.uid(),endpoint:j.endpoint,sub:j},{onConflict:'endpoint'});
      if(r.error)throw r.error;
      st='on';msg={t:'Gotowe. Kliknij „Wyślij próbne”, żeby sprawdzić.',ok:true};
    }catch(e){msg={t:err(e)}}
    paint();
  }
  async function off(){
    try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub){await Sync.client().from('rytm_push').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}st='off';msg={t:'Wyłączono na tym urządzeniu.',ok:true}}
    catch(e){msg={t:err(e)}}
    paint();
  }
  async function test(){
    msg={t:'Wysyłam…',ok:true};paint();
    try{const {data,error}=await Sync.client().functions.invoke('rytm-push',{body:{action:'test'}});if(error)throw error;msg=data&&data.sent?{t:'Wysłane, powinno przyjść za kilka sekund.',ok:true}:{t:'Nie udało się wysłać. Wyłącz i włącz przypomnienia ponownie.'}}
    catch(e){msg={t:err(e)}}
    paint();
  }
  document.addEventListener('click',e=>{const el=e.target.closest('[data-push]');if(!el)return;const a=el.dataset.push;if(a==='on')on();if(a==='off')off();if(a==='test')test()});
  return{boxHtml};
})();
Sync.boot();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
